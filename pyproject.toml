[project]
name = "faker-crypto"
version = "1.0.1"
description = "faker-crypto is a Faker provider for cryto addreses."
authors = [
    {name = "Karambir Singh Nain", email = "hello@karambir.in"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["faker", "test", "mock", "generator", "cryptocurrency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "Faker>=14.2",
]

[project.urls]
Repository = "https://github.com/karambir/faker-crypto"
Homepage = "https://github.com/karambir/faker-crypto/"
Issues = "https://github.com/karambir/faker-crypto/issues"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-sugar~=1.0",
    "ruff~=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    # "UP",   # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["faker_crypto"]

[tool.pytest]
addopts = ["--cov=faker_crypto", "--cov-report=term-missing"]
testpaths = ["tests"]
pythonpath = ["src"]
